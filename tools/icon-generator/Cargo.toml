[package]
name = "icon-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "icon-generator"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
roxmltree = "0.20"
